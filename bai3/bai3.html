<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đếm ký tự - jQuery</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .card {
      width: 340px;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.07);
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      box-sizing: border-box;
    }

    .info {
      margin-top: 10px;
      font-size: 14px;
      color: #0284c7;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Đếm ký tự</h3>
    <textarea id="txtInput" placeholder="Gõ thử vào đây..."></textarea>
    <div class="info">Số ký tự: <span id="charCount">0</span></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function () {
      $("#txtInput").on("input", function () {
        const len = $(this).val().length;
        $("#charCount").text(len);
      });
    });
  </script>
</body>
</html>
